<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Earth</title>

    <!-- external css installation -->

    <link rel="stylesheet" href="./styles/style.css">

    <!-- daisyUI & Tailwind CSS CDN -->

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


    <!-- font awesome CDN -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body>

    <header>
        <div class="navbar bg-base-100 shadow-sm bg-[#15803D]">
            <div class="navbar-start">
                <div class="dropdown">
                    <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h8m-8 6h16" />
                        </svg>
                    </div>
                    <ul tabindex="-1"
                        class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1 mt-3 w-52 p-2 shadow">
                        <li><a>About</a></li>
                        <li><a>Gallery</a></li>
                        <li><a>Plant a Tree</a></li>
                    </ul>
                </div>
                <a class="btn btn-ghost text-xl text-white">Green Earth</a>
            </div>
            <div class="navbar-center hidden lg:flex">
                <ul class="menu menu-horizontal px-1">
                    <li><a class="text-white">About</a></li>
                    <li><a class="text-white">Gallery</a></li>
                    <li><a class="text-white">Plant a Tree</a></li>
                </ul>
            </div>
            <div class="navbar-end">
                <button class="text-green-700 bg-[#FACC15] px-7 py-3 rounded-4xl">Plant a Tree</button>
            </div>
        </div>
    </header>

    <main>
        <section class="hero flex gap-5 justify-between items-center bg-blue-100 mt-2">
            <div><img src="assets/hero-leaf1.png" alt=""></div>
            <div class="text-center">
                <h1 class="text-4xl font-bold text-center mb-2">Plant a Tree, Grow a Future</h1>
                <p class="mb-4">join our mission to plant 1 million trees and make the earth greater for future
                    generations</p>
                <button class="text-green-700 bg-[#FACC15] px-7 py-3 rounded-4xl text-center">Get Started</button>
            </div>
            <div><img src="assets/hero-leaf2.png" alt=""></div>
        </section>

        <section class="border-2 border-solid border-red-500 bg-blue-100 mt-5">
            <h2 class="text-center text-3xl font-semibold">Choose Your Trees</h2>
            <div class="tree-container flex gap-5 justify-between min-h-[500px]">
                <div class="category-container border-2 border-solid border-blue-500 w-2/10">
                    <h3 class="text-xl font-semibold">Category</h3>
                    <div class="categories ">
                        <a href=""></a>
                        <a href=""></a>
                        <a href=""></a>
                        <a href=""></a>
                        <a href=""></a>
                    </div>
                </div>
                <div class="card-container flex justify-between border-2 border-solid border-green-500 w-6/10">
                    <div class="border-2 border-solid border-blue-500 min-w-3/10"></div>
                    <div class="border-2 border-solid border-blue-500 min-w-3/10"></div>
                    <div class="border-2 border-solid border-blue-500 "></div>
                </div>
                <div class="border-2 border-solid border-green-500 w-2/10"></div>
            </div>
        </section>
    </main>

    <footer>

    </footer>
    <script src="./script/index.js"></script>
</body>

</html>
